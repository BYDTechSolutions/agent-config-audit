# Copy to .github/workflows/agent-config.yml. Run it before any job that lets an
# agent work on a pull request.
name: Agent config
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write # only for the SARIF upload; remove both if you skip it
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit agent config
        uses: BYDTechSolutions/agent-config-audit@v0
        # with:
        #   fail-on: should-fix   # stricter; none never fails
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agent-config-audit.sarif
          category: agent-config-audit
      # Needs a committed agent-config.lock (npx @bydtech/agent-config-audit lock).
      - name: Fail if agent config changed since the approved lock
        uses: BYDTechSolutions/agent-config-audit@v0
        with:
          command: diff
